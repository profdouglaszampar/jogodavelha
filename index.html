<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tic Tac Toe Quiz</title>

<style>

body{
font-family:Arial;
background:#0E1D2E;
color:white;
text-align:center;
margin:0;
}

h1{color:#FF6400;}

.screen{display:none;padding:20px;}
.active{display:block;}

button{
background:#FF6400;
border:none;
padding:12px 18px;
font-size:18px;
border-radius:8px;
cursor:pointer;
margin:10px;
color:white;
}

input{padding:10px;font-size:18px;margin:5px}

.games{
display:flex;
justify-content:center;
gap:60px;
flex-wrap:wrap;
}

.board{
display:grid;
grid-template-columns:repeat(3,120px);
gap:10px;
}

.cell{
width:120px;
height:120px;
background:white;
color:#0E1D2E;
font-size:50px;
display:flex;
align-items:center;
justify-content:center;
border-radius:10px;
cursor:pointer;
}

.selected{
background:#FF6400;
color:white;
}

.timer{
height:20px;
background:#444;
width:300px;
margin:auto;
border-radius:10px;
overflow:hidden;
}

.bar{
height:100%;
background:#FF6400;
width:100%;
transition:width 1s linear;
}

#winner{
font-size:50px;
color:#FF6400;
animation:pulse 1s infinite;
}

@keyframes pulse{
0%{transform:scale(1)}
50%{transform:scale(1.2)}
100%{transform:scale(1)}
}

</style>
</head>

<body>

<div id="setup" class="screen active">

<h1>Tic Tac Toe Quiz</h1>

<p>Upload CSV</p>
<input type="file" id="csv">

<h3>Game 1</h3>
<input id="t1" placeholder="Team A">
<input id="t2" placeholder="Team B">

<h3>Game 2</h3>
<input id="t3" placeholder="Team C">
<input id="t4" placeholder="Team D">

<br><br>
<button onclick="startGame()">START</button>

</div>


<div id="game" class="screen">

<h1 id="turn"></h1>

<p>Select a square</p>

<div class="games">

<div>
<h2 id="g1"></h2>
<div id="board0" class="board"></div>
</div>

<div>
<h2 id="g2"></h2>
<div id="board1" class="board"></div>
</div>

</div>

</div>


<div id="questionScreen" class="screen">

<h1 id="question"></h1>

<div class="timer">
<div class="bar" id="bar"></div>
</div>

<br>

<input id="answer" placeholder="Type answer">

<br><br>

<button onclick="checkAnswer()">Submit</button>

<h2 id="feedback"></h2>

<button id="playBtn" style="display:none" onclick="confirmMove()">Play Move</button>

</div>


<script>

let questions=[]
let used=[]

let teams=[]
let turn=0

let boards=[
["","","","","","","","",""],
["","","","","","","","",""]
]

let selectedCell=null
let selectedBoard=null
let currentQuestion

let time=45
let timer

function parseCSV(text){

let rows=text.split("\n")

rows.slice(1).forEach(r=>{

let parts=r.split(";")

if(parts.length>=2){

questions.push({
q:parts[0],
a:parts[1].trim().toLowerCase()
})

}

})

}

function startGame(){

let file=document.getElementById("csv").files[0]

let reader=new FileReader()

reader.onload=function(e){

parseCSV(e.target.result)

teams=[
t1.value,
t2.value,
t3.value,
t4.value
]

g1.innerText=teams[0]+" vs "+teams[1]
g2.innerText=teams[2]+" vs "+teams[3]

createBoard(0)
createBoard(1)

updateTurn()

switchScreen("game")

}

reader.readAsText(file)

}

function createBoard(i){

let board=document.getElementById("board"+i)

for(let c=0;c<9;c++){

let cell=document.createElement("div")
cell.className="cell"

cell.onclick=()=>selectCell(i,c,cell)

board.appendChild(cell)

}

}

function updateTurn(){

let team=teams[turn%4]

let game=turn%4<2?1:2

turnText=team+" turn (Game "+game+")"

document.getElementById("turn").innerText=turnText

}

function selectCell(board,index,cell){

if(board!=(turn%4<2?0:1)) return

if(cell.innerText!="") return

selectedCell=cell
selectedBoard=board
selectedIndex=index

showQuestion()

}

function showQuestion(){

let available=questions.filter(q=>!used.includes(q))

if(available.length==0) used=[]

currentQuestion=available[Math.floor(Math.random()*available.length)]

used.push(currentQuestion)

question.innerText=currentQuestion.q

answer.value=""

feedback.innerText=""

playBtn.style.display="none"

switchScreen("questionScreen")

startTimer()

}

function startTimer(){

time=45

bar.style.width="100%"

timer=setInterval(()=>{

time--

bar.style.width=(time/45*100)+"%"

if(time<=0) checkAnswer()

},1000)

}

function checkAnswer(){

clearInterval(timer)

let ans=answer.value.toLowerCase().trim()

if(ans==currentQuestion.a){

feedback.innerText="Correct!"

playBtn.style.display="inline-block"

}else{

feedback.innerText="Wrong! Answer: "+currentQuestion.a

turn++

setTimeout(()=>{
switchScreen("game")
updateTurn()
},2000)

}

}

function confirmMove(){

let mark=turn%2==0?"X":"O"

selectedCell.innerText=mark

boards[selectedBoard][selectedIndex]=mark

checkWin(selectedBoard)

turn++

switchScreen("game")

updateTurn()

}

function checkWin(b){

let board=boards[b]

let wins=[
[0,1,2],[3,4,5],[6,7,8],
[0,3,6],[1,4,7],[2,5,8],
[0,4,8],[2,4,6]
]

for(let w of wins){

if(board[w[0]] &&
board[w[0]]==board[w[1]] &&
board[w[1]]==board[w[2]]){

showWinner(b,board[w[0]])

}

}

}

function showWinner(b,mark){

let team

if(b==0)
team=mark=="X"?teams[0]:teams[1]
else
team=mark=="X"?teams[2]:teams[3]

document.body.innerHTML="<div id='winner'>"+team+" WINS!</div>"

}

answer.addEventListener("keypress",function(e){
if(e.key==="Enter") checkAnswer()
})

function switchScreen(id){

document.querySelectorAll(".screen")
.forEach(s=>s.classList.remove("active"))

document.getElementById(id).classList.add("active")

}

</script>

</body>
</html>
